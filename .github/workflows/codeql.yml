# .github/workflows/codeql.yml
#
# Explicit CodeQL analysis — replaces GitHub's auto-detected scan so we can
# scope JavaScript/TypeScript to the frontend directory and avoid the
# "no source code seen" error that fires when CodeQL searches the whole repo.

name: "CodeQL"

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths:
              - .
            paths-ignore:
              - aquaia-dataset-builder/frontend/node_modules
              - aquaia-dataset-builder/frontend/.next
              - "**/*.min.js"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
