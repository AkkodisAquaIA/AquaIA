# .github/workflows/cd-prod.yml
#
# AquaIA continuous deployment — production.
#
# Trigger:   git tag matching `v*.*.*` (semver) pushed on any branch.
# Builds:    one Docker image, tagged `${TAG}` (e.g. `v0.1.0`) plus the
#            mobile `latest`, pushed to Docker Hub.
# Deploys:   image is pulled and started on the Azure VM under the prod
#            stack directory (cf. Repository Variable STACK_DIR_PROD),
#            Compose project name `aquaia-prod`.
#
# Sensitive infra values (Docker Hub namespace, on-VM filesystem layout) are
# kept out of the public repo. They are read at runtime from GitHub
# Repository Variables: DOCKERHUB_NAMESPACE, STACK_DIR_PROD. The VM hostname
# comes from the secret VM_HOST. See deploy/README.md §2 for the full list.
#
# Production deploys are gated on a manual approval via the GitHub
# Environment `production` (see deploy/README.md §2.2). The `build-push`
# job runs immediately when the tag is pushed; the `deploy-prod` job pauses
# at the environment gate until a reviewer clicks "Approve and deploy".
#
# This workflow does NOT change when `development` → `main` re-target
# happens: it is tag-driven, not branch-driven.

name: cd-prod

on:
  push:
    tags: ["v*.*.*"]

# One prod deploy at a time. Same rationale as cd-staging: never cancel an
# in-flight deploy.
concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Sensitive infra values come from GitHub Repository Variables.
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  STACK_DIR: ${{ vars.STACK_DIR_PROD }}
  # Project conventions — kept in-tree.
  IMAGE_NAME: aquaia
  STACK_NAME: prod
  COMPOSE_PROJECT: aquaia-prod
  CONTAINER_NAME: aquaia-prod
  VM_USER: deploy

jobs:
  # ---------------------------------------------------------------------------
  # build-push — produce the image with the exact semver tag the operator
  # pushed. Also moves the `latest` floating tag.
  # ---------------------------------------------------------------------------
  build-push:
    name: build & push (Docker Hub)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      image_ref: ${{ steps.tags.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          # github.ref_name is the tag name on a tag push (e.g. "v0.1.0").
          IMAGE_TAG="${GITHUB_REF_NAME}"
          IMAGE_REF="${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"
          # Defensive sanity check — the trigger filters on v*.*.* but we
          # double-check at runtime: never push junk to the `latest` tag.
          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${IMAGE_TAG}' is not a vX.Y.Z semver — refusing to publish"
            exit 1
          fi
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Will push ${IMAGE_REF}:${IMAGE_TAG} and ${IMAGE_REF}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image_ref }}:${{ steps.tags.outputs.image_tag }}
            ${{ steps.tags.outputs.image_ref }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=cd-prod
          cache-to: type=gha,mode=max,scope=cd-prod

  # ---------------------------------------------------------------------------
  # deploy-prod — gated on the GitHub Environment `production`. A reviewer
  # must approve in the UI before this job runs. Once approved, the steps
  # mirror cd-staging.yml but target the prod stack directory.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: deploy → Azure VM (prod)
    runs-on: ubuntu-latest
    needs: build-push
    # Required reviewer + optional wait timer are configured on the
    # `production` environment in repository settings — see deploy/README.md.
    environment:
      name: production
      url: https://hub.docker.com/r/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}/tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/aquaia_ci
          chmod 600 ~/.ssh/aquaia_ci
          ssh-keyscan -H "${VM_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env for the prod stack
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          cat > /tmp/aquaia-prod.env <<EOF
          # Rendered by cd-prod.yml at $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # for tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}).
          IMAGE_TAG=${IMAGE_TAG}
          STACK_NAME=${STACK_NAME}
          DOCKERHUB_NAMESPACE=${DOCKERHUB_NAMESPACE}
          EOF
          echo "Rendered .env:"
          sed 's/^/  /' /tmp/aquaia-prod.env

      - name: Copy compose & .env to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              deploy/docker-compose.yml \
              "${VM_USER}@${VM_HOST}:${STACK_DIR}/docker-compose.yml"
          scp -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              /tmp/aquaia-prod.env \
              "${VM_USER}@${VM_HOST}:${STACK_DIR}/.env"

      - name: Pull, restart, prune & smoke
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" \
              STACK_DIR="${STACK_DIR}" \
              COMPOSE_PROJECT="${COMPOSE_PROJECT}" \
              CONTAINER_NAME="${CONTAINER_NAME}" \
              bash -s <<'REMOTE'
          set -euo pipefail
          cd "${STACK_DIR}"
          echo "[remote] pulling image referenced by .env"
          docker compose -p "${COMPOSE_PROJECT}" pull
          echo "[remote] (re)starting idle profile"
          docker compose -p "${COMPOSE_PROJECT}" --profile idle up -d --remove-orphans
          echo "[remote] cleaning dangling images"
          docker image prune -f
          echo "[remote] smoke test"
          docker exec "${CONTAINER_NAME}" python main.py --help
          echo "[remote] OK"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/aquaia_ci
