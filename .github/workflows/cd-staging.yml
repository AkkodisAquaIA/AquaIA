# .github/workflows/cd-staging.yml
#
# AquaIA continuous deployment — staging.
#
# Trigger:   every push (including merged PR) to the `development` branch.
# Builds:    one Docker image, tagged `dev-<short-sha>` plus the mobile
#            `dev-latest`, pushed to Docker Hub.
# Deploys:   image is pulled and started on the Azure VM under the staging
#            stack directory (cf. Repository Variable STACK_DIR_STAGING),
#            Compose project name `aquaia-staging`.
#
# Sensitive infra values (Docker Hub namespace, on-VM filesystem layout) are
# kept out of the public repo. They are read at runtime from GitHub
# Repository Variables (Settings → Secrets and variables → Actions →
# Variables): DOCKERHUB_NAMESPACE, STACK_DIR_STAGING. The VM hostname comes
# from the secret VM_HOST. See deploy/README.md §2 for the full list.
#
# When `main` becomes the up-to-date branch, change ONLY the trigger below
# (`branches: [development]` → `[main]`). cd-prod.yml is unaffected (it is
# tag-driven, not branch-driven). See docs/cicd_architecture.md.

name: cd-staging

on:
  push:
    branches: [development]

# One staging deploy at a time. We do NOT cancel an in-flight deploy when a
# new commit lands — interrupting a `docker compose up -d` mid-flight would
# leave the VM in a half-pulled state. Instead, the next run waits.
concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Sensitive infra values come from GitHub Repository Variables. They are
  # not secrets (visible to repo admins, not encrypted), but they live
  # outside the public Git history.
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  STACK_DIR: ${{ vars.STACK_DIR_STAGING }}
  # Project conventions — kept in-tree because they have no exploit value
  # and are referenced by the Compose file (also versioned).
  IMAGE_NAME: aquaia
  STACK_NAME: staging
  COMPOSE_PROJECT: aquaia-staging
  CONTAINER_NAME: aquaia-staging
  VM_USER: deploy

jobs:
  # ---------------------------------------------------------------------------
  # build-push — produce the runtime image and publish it to Docker Hub with
  # a SHA-pinned tag plus the mobile `dev-latest`.
  # ---------------------------------------------------------------------------
  build-push:
    name: build & push (Docker Hub)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      image_ref: ${{ steps.tags.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="dev-${SHORT_SHA}"
          IMAGE_REF="${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "image_ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Will push ${IMAGE_REF}:${IMAGE_TAG} and ${IMAGE_REF}:dev-latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image_ref }}:${{ steps.tags.outputs.image_tag }}
            ${{ steps.tags.outputs.image_ref }}:dev-latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Cache scope is per-stack so staging and prod do not invalidate
          # each other (different base trees would still share lower layers
          # by content addressing, but separate scopes keep telemetry clean).
          cache-from: type=gha,scope=cd-staging
          cache-to: type=gha,mode=max,scope=cd-staging

  # ---------------------------------------------------------------------------
  # deploy-staging — render .env, copy compose + env, pull, restart, smoke.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: deploy → Azure VM (staging)
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/aquaia_ci
          chmod 600 ~/.ssh/aquaia_ci
          # Trust-on-first-use: pin the host key seen at this moment. The
          # alternative — a VM_SSH_KNOWN_HOSTS secret — is documented in
          # deploy/README.md as a future hardening step.
          ssh-keyscan -H "${VM_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env for the staging stack
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          cat > /tmp/aquaia-staging.env <<EOF
          # Rendered by cd-staging.yml at $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          # for commit ${GITHUB_SHA}.
          IMAGE_TAG=${IMAGE_TAG}
          STACK_NAME=${STACK_NAME}
          DOCKERHUB_NAMESPACE=${DOCKERHUB_NAMESPACE}
          EOF
          echo "Rendered .env:"
          sed 's/^/  /' /tmp/aquaia-staging.env

      - name: Copy compose & .env to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          # The bootstrap script already created ${STACK_DIR}; we just write
          # into it. Never use scp -r on the whole deploy/ tree — the VM
          # must not see the README, env example, or the bootstrap script.
          scp -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              deploy/docker-compose.yml \
              "${VM_USER}@${VM_HOST}:${STACK_DIR}/docker-compose.yml"
          scp -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              /tmp/aquaia-staging.env \
              "${VM_USER}@${VM_HOST}:${STACK_DIR}/.env"

      - name: Pull, restart, prune & smoke
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aquaia_ci \
              -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" \
              STACK_DIR="${STACK_DIR}" \
              COMPOSE_PROJECT="${COMPOSE_PROJECT}" \
              CONTAINER_NAME="${CONTAINER_NAME}" \
              bash -s <<'REMOTE'
          set -euo pipefail
          cd "${STACK_DIR}"
          echo "[remote] pulling image referenced by .env"
          docker compose -p "${COMPOSE_PROJECT}" pull
          echo "[remote] (re)starting idle profile"
          docker compose -p "${COMPOSE_PROJECT}" --profile idle up -d --remove-orphans
          echo "[remote] cleaning dangling images"
          docker image prune -f
          echo "[remote] smoke test"
          docker exec "${CONTAINER_NAME}" python main.py --help
          echo "[remote] OK"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/aquaia_ci
