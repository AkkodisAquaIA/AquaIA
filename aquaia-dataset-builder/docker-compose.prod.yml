# Production deployment — run from the aquaia-dataset-builder/ directory:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Architecture: Nginx (port 80) → /api/* → backend:8000
#                               → /*     → frontend:3000

services:
  backend:
    build: ./backend
    volumes:
      - ./storage:/storage
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////storage/adiab.db
      - DEBUG=false
      - CORS_ORIGINS=["*"]
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
