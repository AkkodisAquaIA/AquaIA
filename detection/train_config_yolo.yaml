model:
  family: "yolo11"
  size : "n"
  # DINO uses it to create output dir, YOLO uses it to load .pt or .yaml
  # "pretrained" or "random"
  init: "pretrained"

data:
  dataset_yaml: "datasets/coco_custom_match"
  # Display name of class 0 in the two-stage detection -> classification pipeline.
  single_class_name: "specimen"

output:
  # Root directory for run folders. Each run creates project/{YYYYMMDD_HHMMSS}/
  # null automatically uses results/<task>/<family>_<size>_<init>
  # Set a path string to override the automatically generated project directory
  project: null
  exist_ok: true
  save_period: 0
  plots: true

training:
  # ---------- CORE TASK / MODE ----------
  # Both use it to create output dir, YOLO uses it to specify the training task
  task: "detect"
  mode: "train"
  # Ultralytics keeps the source labels unchanged and remaps every taxon ID
  # to class 0 in memory during training and validation.
  single_cls: true

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 30
  # Number of PyTorch DataLoader workers
  workers: 3

  # ---------- TRAINING SCHEDULE ----------
  epochs: 100

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  # Min lr for cosine scheduler = lrf * lr0
  lrf: 0.05
  cos_lr: true
  # Weight decay for optimizer
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  # Weights for class, bbox in loss
  cls: 4.0
  box: 5.0

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults
  # box: 7.5            # box loss gain
  # cls: 0.5            # classification loss gain
  # dfl: 1.5            # distribution focal loss gain

  # ---------- DATA AUGMENTATION ----------
  # Set all zero to disable training augmentation
  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.1
  degrees: 5
  translate: 0.05
  scale: 0.1
  flipud: 0.1
  fliplr: 0.5
  mosaic: 0.01
  cutmix: 0.01
  # Disable Mosaic and CutMix in the last N epochs
  # Make sure close_mosaic <= epochs
  close_mosaic: 40

  # ---------- INFERENCE / EVAL-RELATED ----------
  # Confidence threshold for bbox prediction filtering
  # DINO uses it to filter saved prediction visualizations
  # YOLO uses it as the confidence threshold during validation
  conf: 0.3
  iou: 0.5
  val: true

  # ---------- PERFORMANCE / MISC ----------
  # torch.compile() attempts to optimize the model's forward computation graph
  # to make training or inference faster
  compile: true
