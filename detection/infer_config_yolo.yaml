run:
  # Root directory where all training runs are saved
  runs_root: "results/detect_lpl/from_roboflow_no_aug"
  # One specific training run directory
  run_dir: "results/detect_lpl/from_roboflow_no_aug/20261016_155357"
  # Checkpoint path relative to run_dir, or an absolute path.
  checkpoint: "weights/best.pt"

data:
  infer_data_root: "datasets/LPL_dataset_final/dataset"
  # Dataset split used for inference
  split: "test"
  # Extension of the images in images/<split>, without a leading dot
  img_format: "TIF"

inference:
  imgsz : 640
  batch: 30
  # Number of PyTorch DataLoader workers
  workers: 3
  # Confidence threshold used to filter bbox predictions before mAP calculation
  conf_thresh: 0.05
  # Confidence threshold for bbox prediction visualization filtering
  conf: 0.1
  # IoU threshold for NMS; matches training.iou
  iou: 0.5
  # Number of samples used for prediction visualization, must be greater than 0
  num_samples: 20
  seed: 0

output:
  output_dir: "results/infer_yolo"
