# "Only for <model>" applies only to the parameter on the immediately following line
# If a parameter is preceded by "# Only for <model>", that parameter is used only by the specified model
# Only the exact wording "Only for <model>" indicates that a parameter is model-specific;
# no other wording carries this meaning

run:
  # Root directory where all training runs are saved
  runs_root: "results/detect/dinov3_small_pretrained"
  # One specific training run directory
  run_dir: null

data:
  infer_data_root: "datasets/coco_custom_match"
  # Dataset split used for inference
  split: "test"

inference:
  imgsz : 640
  batch: 8
  # Number of PyTorch DataLoader workers
  workers: 3
  # Confidence threshold used to filter bbox predictions before mAP calculation
  # Only for DINO
  conf_thresh: 0.05
  # Confidence threshold for bbox prediction filtering
  # DINO uses it to filter saved prediction visualizations
  # YOLO uses it to filter saved inference visualizations
  # and predictions passed to the custom compute_metrics()
  # thereby affecting the custom mAP
  conf: 0.3
  # Number of samples used for prediction visualization, must be greater than 0
  num_samples: 20
  seed: 0

output:
  output_dir: null
