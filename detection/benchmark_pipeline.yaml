# Benchmark LPL complet : 500 epochs maximum, early stopping patience 25.
# Les seuls entraînements réalisés par cette campagne sont des fine-tunings LPL.
# Les deux pré-fine-tunings Aquatic Insects / Roboflow sont réutilisés.
benchmark:
  name: "lpl_500ep_patience25_ablation"
  output_dir: "results/benchmarks/lpl_500ep_patience25_ablation"
  continue_on_error: false
  auto_compute_stats: true
  ranking_dataset: "lpl"

model:
  family: "yolo11"
  size: "n"
  pretrained_checkpoint: "yolo11n.pt"

datasets:
  lpl:
    root: "datasets/LPL_dataset_final/dataset"
    img_format: "TIF"
  aquatic_insects:
    root: "datasets/aquatic_insects_v7_1classe"
    img_format: "jpg"

# Protocole identique pour tous les nouveaux fine-tunings LPL.
# Le batch 2 est conservé à toutes les résolutions pour isoler au mieux imgsz.
training_defaults:
  task: "detect"
  device: "cuda"
  imgsz: 640
  batch: 2
  workers: 3
  epochs: 500
  patience: 25
  optimizer: "AdamW"
  lr0: 0.0001
  lrf: 0.05
  cos_lr: true
  weight_decay: 0.00005
  cls: 4.0
  box: 5.0
  dfl: 1.5
  conf: 0.001
  iou: 0.5
  val: true
  seed: 42
  deterministic: true
  compile: true

# mAP à partir de 0.001 ; précision et rappel au seuil fixe 0.05.
inference_defaults:
  imgsz: 640
  batch: 2
  workers: 3
  conf_thresh: 0.001
  pr_conf_thresh: 0.05
  conf: 0.10
  iou: 0.5
  num_samples: 16
  seed: 0

copy_paste_defaults: &copy_paste_defaults
  enabled: true
  cutout_dir: "datasets/LPL_dataset_cutouts_sam3_filtered_by_split/train"
  background_dir: "datasets/Images_fond_blanc_&_bruits"
  synthetic_fraction: 0.5
  min_macroinvertebrates: 4
  max_macroinvertebrates: 10
  padding: 0.08
  max_rotation: 180
  cutout_scale_range: [0.8, 1.2]
  allow_overlap: true
  iou_max: 1.0
  multi_class: false
  use_noisy_backgrounds: true
  cache_backgrounds: true

augmentation_profiles:
  # Baseline : aucune augmentation YOLO native.
  none:
    training: &no_yolo_augmentation
      hsv_h: 0
      hsv_s: 0
      hsv_v: 0
      degrees: 0
      translate: 0
      scale: 0
      shear: 0
      perspective: 0
      flipud: 0
      fliplr: 0
      mosaic: 0
      mixup: 0
      cutmix: 0
      copy_paste: 0
      close_mosaic: 0

  # Ancien protocole fort, conservé comme point de comparaison.
  yolo_standard:
    training:
      hsv_h: 0.015
      hsv_s: 0.3
      hsv_v: 0.3
      degrees: 180
      translate: 0.1
      scale: 0.3
      shear: 0
      perspective: 0
      flipud: 0.5
      fliplr: 0.5
      mosaic: 0.5
      mixup: 0
      cutmix: 0
      copy_paste: 0
      close_mosaic: 25

  # Très faibles variations de couleur et flips, sans Mosaic.
  # La comparaison avec yolo_light_with_mosaic isole l'apport de Mosaic.
  yolo_light_no_mosaic:
    training:
      hsv_h: 0.002
      hsv_s: 0.05
      hsv_v: 0.05
      degrees: 0
      translate: 0
      scale: 0
      shear: 0
      perspective: 0
      flipud: 0.5
      fliplr: 0.5
      mosaic: 0
      mixup: 0
      cutmix: 0
      copy_paste: 0
      close_mosaic: 0

  # Mosaic seule, sans couleur, flip ou transformation géométrique.
  mosaic_only:
    training: &mosaic_only_training
      hsv_h: 0
      hsv_s: 0
      hsv_v: 0
      degrees: 0
      translate: 0
      scale: 0
      shear: 0
      perspective: 0
      flipud: 0
      fliplr: 0
      mosaic: 0.2
      mixup: 0
      cutmix: 0
      copy_paste: 0
      close_mosaic: 25

  # Configuration YOLO light validée : couleurs faibles, flips et Mosaic 0.2.
  yolo_light_with_mosaic:
    training:
      hsv_h: 0.002
      hsv_s: 0.05
      hsv_v: 0.05
      degrees: 0
      translate: 0
      scale: 0
      shear: 0
      perspective: 0
      flipud: 0.5
      fliplr: 0.5
      mosaic: 0.2
      mixup: 0
      cutmix: 0
      copy_paste: 0
      close_mosaic: 25

  # Copy & Paste sans augmentation YOLO native.
  copy_paste:
    training: *no_yolo_augmentation
    copy_paste_data: *copy_paste_defaults

  # Mosaic uniquement sur les vraies images LPL. Les compositions synthétiques
  # restent inchangées après leur génération Copy & Paste.
  copy_paste_mosaic_real_only:
    training: *mosaic_only_training
    copy_paste_data:
      <<: *copy_paste_defaults
      apply_yolo_augmentations_to_synthetic: false

experiments:
  # -------------------------------------------------------------------------
  # Références et transfert depuis Aquatic Insects / Roboflow
  # -------------------------------------------------------------------------
  - id: M0
    initialization_label: "COCO"
    training_label: "Aucun"
    imgsz: 640
    init:
      type: pretrained
    evaluate:
      dataset: lpl
      split: test
      overrides:
        single_class: true

  - id: M1
    initialization_label: "M0"
    training_label: "LPL sans augmentation"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: none
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M2
    initialization_label: "M0"
    training_label: "Aquatic Insects sans augmentation, réutilisé"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    reuse:
      checkpoint: "results/detect/yolo11_n_pretrained/20261016_103935/weights/best.pt"
      run_dir: "results/detect/yolo11_n_pretrained/20261016_103935"
    train:
      dataset: aquatic_insects
      augmentation: none
      overrides: {imgsz: 640}
    evaluate: {dataset: aquatic_insects, split: test}

  - id: M3
    initialization_label: "M0"
    training_label: "Aquatic Insects avec augmentation YOLO, réutilisé"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    reuse:
      checkpoint: "results/detect/yolo11_n_pretrained/20261015_153825/weights/best.pt"
      run_dir: "results/detect/yolo11_n_pretrained/20261015_153825"
    train:
      dataset: aquatic_insects
      augmentation: yolo_standard
      overrides: {imgsz: 640}
    evaluate: {dataset: aquatic_insects, split: test}

  - id: M4
    initialization_label: "M2"
    training_label: "LPL sans augmentation"
    imgsz: 640
    init: {type: experiment, experiment: M2}
    train:
      dataset: lpl
      augmentation: none
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M5
    initialization_label: "M3"
    training_label: "LPL sans augmentation"
    imgsz: 640
    init: {type: experiment, experiment: M3}
    train:
      dataset: lpl
      augmentation: none
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  # -------------------------------------------------------------------------
  # Ablation des augmentations YOLO, toutes initialisées depuis COCO
  # -------------------------------------------------------------------------
  - id: M6
    initialization_label: "M0"
    training_label: "LPL avec augmentations YOLO fortes"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: yolo_standard
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M7
    initialization_label: "M0"
    training_label: "LPL avec couleurs légères et flips, sans Mosaic"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: yolo_light_no_mosaic
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M8
    initialization_label: "M0"
    training_label: "LPL avec Mosaic uniquement"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: mosaic_only
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M9
    initialization_label: "M0"
    training_label: "LPL avec augmentations YOLO légères et Mosaic"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: yolo_light_with_mosaic
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  # -------------------------------------------------------------------------
  # Copy & Paste à 640 px uniquement
  # -------------------------------------------------------------------------
  - id: M10
    initialization_label: "M0"
    training_label: "LPL avec Copy & Paste"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: copy_paste
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  - id: M11
    initialization_label: "M0"
    training_label: "LPL avec Copy & Paste et Mosaic sur images réelles"
    imgsz: 640
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: copy_paste_mosaic_real_only
      overrides: {imgsz: 640}
    evaluate: {dataset: lpl, split: test}

  # -------------------------------------------------------------------------
  # Influence de la résolution sur la baseline uniquement
  # -------------------------------------------------------------------------
  - id: M12
    initialization_label: "M0"
    training_label: "LPL sans augmentation"
    imgsz: 1024
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: none
      overrides: {imgsz: 1024}
    evaluate:
      dataset: lpl
      split: test
      overrides: {imgsz: 1024}

  - id: M13
    initialization_label: "M0"
    training_label: "LPL sans augmentation"
    imgsz: 2048
    init: {type: experiment, experiment: M0}
    train:
      dataset: lpl
      augmentation: none
      overrides: {imgsz: 2048}
    evaluate:
      dataset: lpl
      split: test
      overrides: {imgsz: 2048}
