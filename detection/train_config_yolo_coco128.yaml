model:
  family: "yolo11"
  size: "n"
  init: "pretrained" #"random" 

data:
  dataset_yaml: "datasets/coco128"

output:
  exist_ok: true
  save_period: 0
  plots: true

training:
  task: "detect"
  mode: "train"
  device: "auto"

  imgsz: 320
  batch: 8
  workers: 2
  cache: false

  epochs: 10 # 300
  patience: 20
  resume: false

  optimizer: "AdamW"
  lr0: 0.0005
  lrf: 0.05
  cos_lr: true
  momentum: 0.9
  weight_decay: 0.001
  warmup_epochs: 2
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  box: 7.5
  cls: 0.5
  dfl: 1.5
  nbs: 64

  conf: 0.001
  iou: 0.7
  max_det: 300
  val: true
  save_json: false

  augment: true
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.10
  scale: 0.50
  shear: 2.0
  perspective: 0.0005
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.80
  mixup: 0.05
  copy_paste: 0.0
  close_mosaic: 5

  verbose: false
  deterministic: true
  profile: false
  plots: true
  compile: false
