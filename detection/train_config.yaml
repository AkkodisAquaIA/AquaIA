# ----------------------------------------------------------------------
# Model section: 
# ----------------------------------------------------------------------
model:
  family: "dinov3"
  size : "small"
  init: "pretrained"   # "pretrained" or "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "datasets/coco_custom_match"
  # Image loader used by the DINO trainer. Use "npy" to keep the legacy path.
  loader: "jpg"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Root directory for run folders. Each run creates output/{YYYYMMDD_HHMMSS}/.
  project: "runs"
  exist_ok: true
  save_period: 0
  plots: true

# ----------------------------------------------------------------------
# Logging section: persistent logs and checkpointing
# ----------------------------------------------------------------------
logging:
  # Save last.pt + last_training_state.pt every N epochs (0 = only at end).
  save_period: 5
  # Update the heartbeat file every N batches.
  heartbeat_every_n_batches: 10
  # Path to the global run registry (one JSON line per run).
  registry_path: "runs/registry.jsonl"

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  task: "detect"
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 30
  workers: 0

  # ---------- TRAINING SCHEDULE ----------
  epochs: 2
  warmup_ratio: 0.05

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  lrf: 0.05
  cos_lr: true
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  cost_bbox_type: "l1"
  cls: 4.0
  box: 5.0
  giou: 2.0

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults.
  # box: 7.5            # box loss gain
  # cls: 0.5            # classification loss gain
  # dfl: 1.5            # distribution focal loss gain

  # ---------- DATA AUGMENTATION ----------
  augment: true

  # Color jitter in HSV space.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # Geometric transforms.
  degrees: 10.0
  translate: 0.10
  scale: 0.50
  shear: 2.0
  perspective: 0.0005

  # Flips.
  flipud: 0.0
  fliplr: 0.5

  # Advanced augmentations.
  mosaic: 0.80
  mixup: 0.05
  copy_paste: 0.0     # mainly for segmentation, harmless here

  # Disable mosaic in the last N epochs to stabilize training.
  close_mosaic: 40

  # ---------- INFERENCE / EVAL-RELATED ----------
  conf: 0.3
  iou: 0.5
  val: true

  # ---------- PERFORMANCE / MISC ----------
  compile: true
