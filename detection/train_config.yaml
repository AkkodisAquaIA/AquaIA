# ----------------------------------------------------------------------
# Model section: 
# ----------------------------------------------------------------------
model:
  family: "yolo26"
  size : "n"
  init: "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "datasets/coco8"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Output directory. Relative path is resolved from YAML directory.
  exist_ok: true
  save_period: 0
  plots: true

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  task: "detect"
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 2
  workers: 0

  # ---------- TRAINING SCHEDULE ----------
  epochs: 600

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  lrf: 0.05
  cos_lr: true
  weight_decay: 0.00005

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults.
  box: 7.5            # box loss gain
  cls: 0.5            # classification loss gain
  dfl: 1.5            # distribution focal loss gain

  # ---------- DATA AUGMENTATION ----------
  augment: true

  # Color jitter in HSV space.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # Geometric transforms.
  degrees: 10.0
  translate: 0.10
  scale: 0.50
  shear: 2.0
  perspective: 0.0005

  # Flips.
  flipud: 0.0
  fliplr: 0.5

  # Advanced augmentations.
  mosaic: 0.80
  mixup: 0.05
  copy_paste: 0.0     # mainly for segmentation, harmless here

  # Disable mosaic in the last N epochs to stabilize training.
  close_mosaic: 40

  # ---------- INFERENCE / EVAL-RELATED ----------
  conf: 0.05
  iou: 0.5
  val: true

  # ---------- PERFORMANCE / MISC ----------
  compile: false
