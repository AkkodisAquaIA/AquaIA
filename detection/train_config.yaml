# ----------------------------------------------------------------------
# Model section: 
# ----------------------------------------------------------------------
model:
  family: "dinov3"
  size : "small"
  # DINO uses it to create output dir, YOLO uses it to load .pt or .yaml
  init: "pretrained"   # "pretrained" or "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "datasets/coco_custom_match"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Root directory for run folders. Each run creates output/{YYYYMMDD_HHMMSS}/.
  # !Warning! not used, overided by load_train_config()
  project: "runs"
  # Only for YOLO
  exist_ok: true
  # Only for YOLO
  save_period: 0
  # Only for YOLO
  plots: true

# ----------------------------------------------------------------------
# Logging section: persistent logs and checkpointing
# ----------------------------------------------------------------------
logging:
  # Save last.pt + last_training_state.pt every N epochs (0 = only at end).
  # Only for DINO
  save_period: 5
  # Update the heartbeat file every N batches.
  # Only for DINO
  heartbeat_every_n_batches: 10
  # Path to the global run registry (one JSON line per run).
  # Only for DINO
  registry_path: "runs/registry.jsonl"

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  # Both use it to create output dir, YOLO uses it to specify the training task
  task: "detect"
  # Only for YOLO
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 32
  # Number of PyTorch DataLoader workers used by DINO and YOLO
  workers: 3

  # ---------- TRAINING SCHEDULE ----------
  epochs: 10
  # If cos_lr, warmup steps = epochs * warmup_ratio 
  # Only for DINO
  warmup_ratio: 0.05

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  # Min lr for cosine scheduler = lrf * lr0
  lrf: 0.05
  cos_lr: true
  # Weight decay for optimizer
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  # Weights for class, bbox, giou in matching cost
  # Only for DINO
  cost_class: 2.0
  # Only for DINO
  cost_bbox: 5.0
  # Only for DINO
  cost_giou: 2.0
  # Only for DINO
  cost_bbox_type: "l1"
  # Weights for class, bbox, giou in loss
  cls: 4.0
  box: 5.0
  # Only for DINO
  giou: 2.0

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults.
  # box: 7.5            # box loss gain
  # cls: 0.5            # classification loss gain
  # dfl: 1.5            # distribution focal loss gain

  # ---------- DATA AUGMENTATION ----------
  # Only for DINO, set all zero to disable training augmentation for YOLO
  augment: true

  hsv_h: 0.005
  hsv_s: 0.1
  hsv_v: 0.1
  degrees: 180.0
  translate: 0.1
  scale: 0.2
  flipud: 0.5
  fliplr: 0.5
  mosaic: 0.1
  cutmix: 0.05
  # Disable Mosaic and CutMix in the last N epochs
  # Values greater than or equal to epochs disable them from the first epoch
  close_mosaic: 5

  # ---------- INFERENCE / EVAL-RELATED ----------
  # Confidence threshold for mAP calculation
  conf_thresh: 0.05
  # Confidence threshold for bbox filtering
  # DINO uses it to filter training-set visualization predictions
  # YOLO uses it as the confidence threshold during validation
  conf: 0.3
  # Only for YOLO
  iou: 0.5
  # Only for YOLO
  val: true

  # ---------- PERFORMANCE / MISC ----------
  # torch.compile() attempts to optimize the model's forward computation graph
  # to make training or inference faster
  compile: true
