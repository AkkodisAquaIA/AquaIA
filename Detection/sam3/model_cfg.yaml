    CONF: 0.2
    PATH: "C:/Users/zhijian.zhou/OneDrive - Akkodis/Travail/10_AquaIA/01_Git/yoloe-26x-seg.pt"
    HALF: false
    SAVE: true
    IMGSZ: 640
    BATCH: 16
    NMS_CLS: 0.7  # Not native per-class NMS
    NMS_GLB: false  # Not native global NMS
    UNIC: false # If true, keep only the highest-confidence bbox per image