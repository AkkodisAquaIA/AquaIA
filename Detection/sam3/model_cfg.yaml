# Images to be predicted with detection models
IMAGES_FOLDER: "C:/Users/zhijian.zhou/OneDrive - Akkodis/Travail/10_AquaIA/08_Data/PERLA"

# Active model key: "sam3" or "yoloe26"
MODEL_NAME: "sam3"

MODEL_CFG:
  sam3:
    CONF: 0.5
    TASK: "segment" # "detect" seems have no effect
    MODE: "predict"
    PATH: "C:/Users/zhijian.zhou/OneDrive - Akkodis/Travail/10_AquaIA/01_Git/sam3.pt"
