# AquaIA - Generic Ultralytics YOLO training config
#
# Ultralytics references (full arguments and hyperparameter definitions):
# - Train (all train arguments):
#   https://docs.ultralytics.com/modes/train/
# - Configuration (default values, full config file):
#   https://docs.ultralytics.com/usage/cfg/
#   https://github.com/ultralytics/ultralytics/blob/main/ultralytics/cfg/default.yaml
# - Hyperparameter Tuning (explains lr0, lrf, momentum, etc.):
#   https://docs.ultralytics.com/guides/hyperparameter-tuning/
# - Data Augmentation (hsv_*, mosaic, mixup, flips, etc.):
#   https://docs.ultralytics.com/guides/yolo-data-augmentation/
#
# NOTE:
# This config overrides the most relevant train hyperparameters for AquaIA.
# It is NOT guaranteed to contain every possible argument.
# For the full and always up-to-date list, see Ultralytics `default.yaml`
# and the Train docs linked above.

# ----------------------------------------------------------------------
# Model section: YOLO backbone choice
# ----------------------------------------------------------------------
model:
  # Model loading:
  # - family: YOLO major line, e.g. "yolo8", "yolo11", "yolo26"
  # - size: model scale, one of: n, s, m, l, x
  # - init:
  #   - "pretrained" -> loads "{family}{size}.pt" (weights pretrained by Ultralytics)
  #   - "random"     -> loads "{family}{size}.yaml" (from scratch architecture definition)
  family: "yolo11"
  size: "n"
  init: "pretrained"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # dataset_yaml: path to the dataset YAML.
  #   - can be relative (resolved from this config file location)
  #   - or an environment variable, e.g. ${DATASET_YAML}
  dataset_yaml: "app/datasets/coco128/coco128_custom.yaml"

# ----------------------------------------------------------------------
# Output section: Ultralytics output handling
# ----------------------------------------------------------------------
output:
  # Output directory. Relative path is resolved from YAML directory.
  project: "models"
  exist_ok: true
  save: true
  save_period: 0
  plots: true

  # Optional: export the fully-resolved config used at runtime.
  write_config: true
  config_filename: "resolved_config.yaml"

# ----------------------------------------------------------------------
# Training section: arguments forwarded to model.train()
# Only keys listed here override Ultralytics defaults.
# All others keep the default values from `default.yaml`.
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  task: "detect"      # detection task
  mode: "train"       # always "train" here

  # ---------- DEVICE ----------
  # Use "cpu" for CPU-only, 0 or "0" for the first CUDA GPU, "0,1" for multi-GPU.
  device: "0"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640          # input size (long side)
  batch: 4            # batch size
  rect: false         # rectangular batching (True disables mosaic)
  workers: 2          # dataloader workers
  cache: false        # False | True | "ram" | "disk"

  # Train only a subset of data/classes if needed (otherwise leave defaults).
  single_cls: false   # treat dataset as single class
  classes: null       # list of class indices to train on (e.g. [0, 1, 2])
  fraction: 1.0       # fraction of dataset to use (0–1)

  # ---------- TRAINING SCHEDULE ----------
  epochs: 800        # total epochs
  patience: 5         # early stopping patience (epochs without mAP improvement)
  resume: false       # resume from last checkpoint in project/name

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"  # SGD | Adam | AdamW | etc.
  lr0: 0.0020         # initial learning rate
  lrf: 0.05           # final LR factor (lr_final = lr0 * lrf)
  cos_lr: true        # cosine LR schedule if True

  momentum: 0.9       # SGD momentum or Adam/AdamW beta1
  weight_decay: 0.01  # L2 regularization on weights

  warmup_epochs: 2    # number of warmup epochs
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # ---------- LOSS / BOX / CLS HYPERPARAMETERS ----------
  # See Ultralytics default.yaml for the latest recommended defaults.
  box: 7.5            # box loss gain
  cls: 0.5            # classification loss gain
  dfl: 1.5            # distribution focal loss gain
  label_smoothing: 0.03

  # Nominal batch size for loss normalization.
  nbs: 64

  # ---------- INFERENCE / EVAL-RELATED ----------
  conf: 0.001         # confidence threshold for eval
  iou: 0.7            # IoU threshold for NMS/eval
  max_det: 300        # max detections per image
  val: true           # run validation during training
  save_json: false    # COCO JSON eval

  # ---------- DATA AUGMENTATION ----------
  augment: true

  # Color jitter in HSV space.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4

  # Geometric transforms.
  degrees: 10.0
  translate: 0.10
  scale: 0.50
  shear: 2.0
  perspective: 0.0005

  # Flips.
  flipud: 0.0
  fliplr: 0.5

  # Advanced augmentations.
  mosaic: 0.80
  mixup: 0.05
  copy_paste: 0.0     # mainly for segmentation, harmless here

  # Disable mosaic in the last N epochs to stabilize training.
  close_mosaic: 40

  # ---------- PERFORMANCE / MISC ----------
  amp: false          # Automatic Mixed Precision
  verbose: false      # verbose logs
  deterministic: true # reproducible training (may be slightly slower)
  profile: false      # profile speed

  # Logging/export related flags (kept close to defaults).
  plots: true         # per-epoch plots (also controlled by output.plots)
  compile: false      # torch.compile (PyTorch 2.x)
