# AquaIA - Generic DETR+DINO training config
#
# This file follows the same structure and naming convention as
# Detection/YOLO/yolo_train_config.yaml wherever the concepts match.

# ----------------------------------------------------------------------
# Model section: detector choice / initialization
# ----------------------------------------------------------------------
model:
  family: "dinov3"
  size : "s"
  init: "random"

# ----------------------------------------------------------------------
# Data section: train/val dataset
# ----------------------------------------------------------------------
data:
  # Dataset path consumed by the DINO trainer.
  dataset_yaml: "../../datasets/coco128"

# ----------------------------------------------------------------------
# Output section: training artifact handling
# ----------------------------------------------------------------------
output:
  # Output directory. Relative path is resolved from YAML directory.
  project: "../../results/detection/detr"
  exist_ok: true
  save: true
  save_period: 0
  plots: false

  # Optional: export the fully-resolved config used at runtime.
  write_config: true
  config_filename: "resolved_config.yaml"

# ----------------------------------------------------------------------
# Training section: arguments used by the DINO trainer
# ----------------------------------------------------------------------
training:
  # ---------- CORE TASK / MODE ----------
  task: "detect"
  mode: "train"

  # ---------- DEVICE ----------
  device: "auto"

  # ---------- DATA INPUT / LOADING ----------
  imgsz: 640
  batch: 64
  workers: 0

  # ---------- TRAINING SCHEDULE ----------
  epochs: 3500
  warmup_ratio: 0.05

  # ---------- OPTIMIZER & LR ----------
  optimizer: "AdamW"
  lr0: 0.0005
  lrf: 0.05
  cos_lr: true
  weight_decay: 0.00005

  # ---------- LOSS / MATCHER HYPERPARAMETERS ----------
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  cost_bbox_type: "l1"
  cls: 4.0
  box: 5.0
  giou: 2.0

  # ---------- INFERENCE / EVAL-RELATED ----------
  conf: 0.05
  iou: 0.5
  val: true

  # ---------- PERFORMANCE / MISC ----------
  compile: true
